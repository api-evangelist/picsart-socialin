aid: picsart-socialin
name: PicsArt (Socialin)
description: >-
  Picsart (Socialin Inc.) is a digital creation and photo/video editing company
  whose Picsart Enterprise "Creative APIs" give developers programmable access to
  image editing, video editing, generative AI, and variable-data content
  generation. The REST APIs cover remove-background, upscaling, enhancement,
  effects, masking, watermarking, and vectorization for images; trimming,
  cropping, concatenation, transcription, and CTV encoding for video; text-to-image,
  text-to-sticker, logo generation, inpainting/outpainting, and text-to-video for
  GenAI; plus a variable-data content export pipeline. All services authenticate
  with an X-Picsart-API-Key header, are described with OpenAPI 3.0/3.1, ship
  official TypeScript, Java, and Python SDKs, a hosted Model Context Protocol (MCP)
  server, a Postman workspace, and an embeddable Photo and Video Editor SDK.
