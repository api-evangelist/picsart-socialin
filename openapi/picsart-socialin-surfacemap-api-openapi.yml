  schemas:
    ImageParameters:
      type: object
      properties:
        image:
          description: Source image file (binary). (If this parameter is present, the other image source parameters must be empty.)
          type: string
          format: binary
        image_url:
          type: string
          description: Source image URL. (If this parameter is present, the other image source parameters must be empty.)
          maxLength: 2083
          minLength: 1
          format: uri
        image_id:
          type: string
          deprecated: true
          description: Deprecated. Source image ID of an image previously uploaded to Picsart or result image ID from a different API. (If this parameter is present, the other image source parameters must be empty.)
    Error:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
      required:
      - detail
    401_Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        detail:
          type: string
      required:
      - detail
    SurfacemapParameters:
      type: object
      properties:
        mask:
          description: Source mask file (binary). (If this parameter is present, the other mask source parameters must be empty.)
          type: string
          format: binary
        mask_url:
          type: string
          description: Source mask URL. (If this parameter is present, the other mask source parameters must be empty.)
          maxLength: 2083
          minLength: 1
          format: uri
        mask_id:
          type: string
          deprecated: true
          description: Deprecated. Source mask ID of an mask previously uploaded to Picsart or result mask ID from a different API. (If this parameter is present, the other mask source parameters must be empty.)
        sticker:
          description: Source sticker file (binary). (If this parameter is present, the other sticker source parameters must be empty.)
          type: string
          format: binary
        sticker_url:
          type: string
          description: Source sticker URL. (If this parameter is present, the other sticker source parameters must be empty.)
          maxLength: 2083
          minLength: 1
          format: uri
        sticker_id:
          type: string
          deprecated: true
          description: Deprecated. Source sticker ID of an sticker previously uploaded to Picsart or result sticker ID from a different API. (If this parameter is present, the other sticker source parameters must be empty.)
        format:
          type: string
          default: JPG
          enum:
          - JPG
          - PNG
          - WEBP
          description: "Optionally select one of the image formats (JPG is chosen if left blank). Options are as follows:\n  * JPG\n  * PNG\n  * WEBP\n"
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Picsart-API-Key
