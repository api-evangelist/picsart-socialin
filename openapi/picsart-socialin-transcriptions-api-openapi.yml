  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
      required:
      - detail
    401_Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        detail:
          type: string
      required:
      - detail
    TranscribeParameters:
      type: object
      properties:
        language:
          type: string
          default: en
          enum:
          - af
          - ar
          - am
          - az
          - be
          - bs
          - bg
          - ca
          - zh
          - hr
          - cs
          - da
          - nl
          - en
          - et
          - fi
          - fr
          - gl
          - de
          - el
          - he
          - hi
          - hu
          - is
          - id
          - it
          - ja
          - kn
          - kk
          - ko
          - lv
          - lt
          - mk
          - ms
          - mr
          - mi
          - ne
          - false
          - fa
          - pl
          - pt
          - ro
          - ru
          - sr
          - sk
          - sl
          - es
          - sw
          - sv
          - tl
          - ta
          - th
          - tr
          - uk
          - ur
          - vi
          - cy
          description: "Optionally select one of the languages in the 2-character format (ISO 639-1). Options are as follows:\n  * Afrikaans - af\n  * Arabic - ar\n  * Armenian - am\n  * Azerbaijani - az\n  * Belarusian - be\n  * Bosnian - bs\n  * Bulgarian - bg\n  * Catalan - ca\n  * Chinese - zh\n  * Croatian - hr\n  * Czech - cs\n  * Danish - da\n  * Dutch - nl\n  * English - en\n  * Estonian - et\n  * Finnish - fi\n  * French - fr\n  * Galician - gl\n  * German - de\n  * Greek - el\n  * Hebrew - he\n  * Hindi - hi\n  * Hungarian - hu\n  * Icelandic - is\n  * Indonesian - id\n  * Italian - it\n  * Japanese - ja\n  * Kannada - kn\n  * Kazakh - kk\n  * Korean - ko\n  * Latvian - lv\n  * Lithuanian - lt \n  * Macedonian - mk\n  * Malay - ms\n  * Marathi - mr\n  * Maori - mi\n  * Nepali - ne\n  * Norwegian - no\n  * Persian - fa\n  * Polish - pl\n  * Portuguese - pt\n  * Romanian - ro\n  * Russian - ru\n  * Serbian - sr\n  * Slovak - sk\n  * Slovenian - sl\n  * Spanish - es\n  * Swahili - sw\n  * Swedish - sv\n  * Tagalog - tl\n  * Tamil - ta\n  * Thai - th\n  * Turkish - tr\n  * Ukrainian - uk\n  * Urdu - ur\n  * Vietnamese - vi\n  * Welsh - cy\n"
        format:
          type: string
          default: TXT
          enum:
          - TXT
          - SRT
          - VTT
          - SBV
          description: "Optionally select one of the transcription formats (TXT is chosen if left blank). Options are as follows:\n  * TXT\n  * SRT\n  * VTT\n  * SBV\n"
        granularity:
          type: string
          default: sentence
          enum:
          - 1-word
          - 2-words
          - sentence
          description: Define the granularity of the subtitles. This works for SRT, VTT and SBV formats only.
    TranscribeFileParameters:
      type: object
      properties:
        file_url:
          type: string
          description: Source video or audio URL. The maximum file size is 25mb.
          maxLength: 2083
          minLength: 1
          format: uri
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Picsart-API-Key
