        X-Picsart-Credit-Available:
          schema:
            type: integer
          description: The remaining number of the credits on the balance.
  schemas:
    DataFileParameters:
      type: object
      properties:
        data:
          description: 'Source data file as a string. Comma separated values only. The first line should always be the header line, with column names. Only the first 50 data rows will be processed. (If this parameter is present, the other data file source parameters must be empty.)

            '
          type: string
        data_file:
          description: 'Source data (CSV) file (binary, attachment). The first line should always be the header line, with column names. Only the first 50 data rows will be processed. (If this parameter is present, the other data file source parameters must be empty.)

            '
          type: string
          format: binary
        data_file_url:
          type: string
          description: 'Source data (CSV) file URL. The first line should always be the header line, with column names. Only the first 50 data rows will be processed. (If this parameter is present, the other data file source parameters must be empty.)

            '
          maxLength: 2083
          minLength: 1
          format: uri
    TemplateParameters:
      type: object
      properties:
        template_id:
          type: string
          description: Source template ID from Picsart Inventory. (If this parameter is present, the other template source parameters must be empty.)
        template:
          description: Source replay file (binary). (If this parameter is present, the other template source parameters must be empty.)
          type: string
          format: binary
        template_url:
          type: string
          description: Source replay URL. (If this parameter is present, the other template source parameters must be empty.)
          maxLength: 2083
          minLength: 1
          format: uri
    401_Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        detail:
          type: string
      required:
      - detail
    ExportVariableDataContentParameters:
      type: object
      properties:
        mapping:
          type: string
          description: Comma separated mapping of fields.
        format:
          type: string
          default: PDF
          enum:
          - PDF
          - PNG
          - JPG
          - MP4
          - REPLAY
          description: "Optionally select one of the export formats. Options are as follows:\n  * PDF\n  * PNG\n  * JPG\n  * MP4\n  * REPLAY\n"
    Error:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
      required:
      - detail
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Picsart-API-Key
