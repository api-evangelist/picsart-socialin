  schemas:
    ExportParameters:
      type: object
      properties:
        export:
          type: object
          properties:
            format:
              type: string
              default: MP4
              enum:
              - MOV
              - MP4
              - WEBM
              - GIF
              description: "Optionally select one of the output video formats (MP4 is chosen if left blank). Container options are as follows\n  * MOV\n  * MP4\n  * WEBM\n  * GIF\n"
            frame_rate:
              type: integer
              default: 30
              minimum: 1
              maximum: 60
              description: The output video frame rate.
            bitrate:
              type: integer
              minimum: 1
              maximum: 10000
              description: The output video bitrate in kb/s. Leave empty to set automatically and optimize accordingly.
          default:
            format: MP4
            frame_rate: 30
    ExtractAudioParameters:
      type: object
      properties:
        format:
          type: string
          default: mp3
          enum:
          - mp3
          - m4a
          - wav
          - flac
          description: "Optionally select one of the audio formats (mp3 is chosen if left blank). Options are as follows:\n  * mp3\n  * m4a\n  * wav\n  * flac\n"
    Error:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
      required:
      - detail
    401_Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        detail:
          type: string
      required:
      - detail
    VideoParameters:
      type: object
      properties:
        video_url:
          type: string
          description: Source video URL.
          maxLength: 2083
          minLength: 1
          format: uri
    AdjustAudioParameters:
      type: object
      properties:
        audio_url:
          type:
          - string
          - 'null'
          description: The sound file url.
        audio_volume:
          type: integer
          minimum: 0
          maximum: 100
          description: The volume of the audio.
          default: 100
        video_volume:
          type: integer
          minimum: 0
          maximum: 100
          description: The volume of the video.
          default: 100
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Picsart-API-Key
