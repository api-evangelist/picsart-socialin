        '431':
          $ref: '#/components/responses/431'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /background/pattern:
    post:
      summary: Pattern Generator
      operationId: image-generate-pattern
      description: 'The *pattern generator* tool generates a background texture pattern for the input image. You can create unlimited patterns from the same source image.

        '
      tags:
      - Content Generation
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/ImageParameters'
