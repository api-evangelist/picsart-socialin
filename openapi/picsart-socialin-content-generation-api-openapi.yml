  schemas:
    ImageParameters:
      type: object
      properties:
        image:
          description: Source image file (binary). (If this parameter is present, the other image source parameters must be empty.)
          type: string
          format: binary
        image_url:
          type: string
          description: Source image URL. (If this parameter is present, the other image source parameters must be empty.)
          maxLength: 2083
          minLength: 1
          format: uri
        image_id:
          type: string
          deprecated: true
          description: Deprecated. Source image ID of an image previously uploaded to Picsart or result image ID from a different API. (If this parameter is present, the other image source parameters must be empty.)
    Error:
      type: object
      properties:
        message:
          type: string
        detail:
          type: string
      required:
      - detail
    401_Error:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
        detail:
          type: string
      required:
      - detail
    TextureParameters:
      type: object
      properties:
        format:
          type: string
          default: JPG
          enum:
          - JPG
          - PNG
          - WEBP
          description: "Optionally select one of the image formats (JPG is chosen if left blank). Options are as follows:\n  * JPG\n  * PNG\n  * WEBP\n"
        width:
          type: integer
          description: Specify the width of the output image in pixels. The default is 1024 and the maximum acceptable value is 8000.
          default: 1024
          maximum: 8000
        height:
          type: integer
          description: Specify the height of the output image in pixels. The default is 1024 and the maximum acceptable value is 8000.
          default: 1024
          maximum: 8000
        offset_x:
          type: integer
          description: Specify the pattern location, with x(width). Calculation starts from the center of the image. Default is 0.
          default: 0
        offset_y:
          type: integer
          description: Specify the pattern location  with y(height). Calculation starts from the center of the image. Default is 0.
          default: 0
        pattern:
          type: string
          enum:
          - hex
          - mirror
          - diamond
          - hex2
          - tile
          default: hex
          description: Choose a pattern for the background texture. Default is hex.
        rotate:
          type: integer
          minimum: -180
          maximum: 180
          default: 0
          description: Enter an integer value to rotate the texture pattern from -180 to +180. Default is 0.
        scale:
          type: number
          format: float
          minimum: 0.5
          maximum: 10
          default: 1.0
          description: Enter a floating point number between 0.5 - 10.0 to scale the background texture. Default is 1.0.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Picsart-API-Key
