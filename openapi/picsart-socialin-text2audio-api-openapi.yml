  schemas:
    Text2SoundModels:
      type: object
      properties:
        model:
          type:
          - string
          - 'null'
          enum:
          - urn:air:elevenlabs:model:elevenlabs:elevenlabs-sound-effects-v2@1
          - urn:air:kling:model:kling:kling-text-to-audio@1
          default: urn:air:elevenlabs:model:elevenlabs:elevenlabs-sound-effects-v2@1
          description: 'Optionally choose a specific AI model to use for this audio generation.

            If not specified, a default model will be applied. Please note that the default model may change over time as Picsart continues to improve performance and accuracy. Any change to the default will be made only after thorough testing and validation to ensure it delivers better results.

            If you require consistent behavior or wish to evaluate different models on your own, we recommend explicitly setting this parameter.

            '
    Text2SpeechModels:
      type: object
      properties:
        model:
          type:
          - string
          - 'null'
          enum:
          - urn:air:openai:model:openai:tts-1@1
          - urn:air:elevenlabs:model:elevenlabs:eleven-v3@1
          - urn:air:async:model:async:async-flash-v1.0@1
          default: urn:air:openai:model:openai:tts-1@1
          description: 'Optionally choose a specific AI model to use for this audio generation.

            If not specified, a default model will be applied. Please note that the default model may change over time as Picsart continues to improve performance and accuracy. Any change to the default will be made only after thorough testing and validation to ensure it delivers better results.

            If you require consistent behavior or wish to evaluate different models on your own, we recommend explicitly setting this parameter.

            '
        voice:
          type:
          - string
          - 'null'
          description: "Voice for speech synthesis.\nConsidering different models have different voices and that list changes over time, the list of supported voices is not provided here. Please go ahead to check for available voices on each provider's website.\nWhen not provided, the following default voices will be applied:\n  * OpenAI > alloy\n  * Eevenlabs > Rachel\n  * Async > nyomi\n"
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        detail:
          type: string
      required:
      - detail
    Text2SpeechParameters:
      required:
      - text
      type: object
      properties:
        text:
          type: string
          description: The text to speak. Up to 5000 characters.
        language:
          type: string
          description: 'The language to speak.

            '
          enum:
          - en
          - fr
          default: en
    Text2SoundParameters:
      required:
      - prompt
      type: object
      properties:
        prompt:
          type: string
          description: The prompt for the music/sound generation.
        duration:
          type:
          - number
          - 'null'
          description: 'The duration for the generated audio in seconds

            Note these ranges from vendors: ElevenLabs: 0.5-22. Kling: 3-10. Auto if omitted.

            '
          example: 3
          maximum: 22
          minimum: 0.5
        loop:
          type: boolean
          default: false
          description: 'Create looping audio. The usage of this param is not guarantteed as limited number of models do support this. (For example: Supported by ElevenLabs only.)

            '
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Picsart-API-Key
