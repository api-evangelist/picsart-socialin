  /image/{transaction_id}:
    get:
      summary: Get the Image result
      operationId: image-getresult
      description: 'Use the image editing transaction ID to get the result image file URL.

        '
      parameters:
      - in: path
        name: transaction_id
        schema:
          type: string
        required: true
        description: The ID returned from the POST method when it's done asynchronously.
